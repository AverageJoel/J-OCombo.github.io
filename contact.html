		<link rel="icon" type="image/jpeg" href="images/j_o_combo_logo.jpg" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header" style="margin: 0 0 -3em 0; padding: 7em 0 0 0;">
						<div style="text-align: center;">
							<img src="images/j_o_combo_logo.jpg" alt="J&O Combo" style="height: 12em; width: 12em; border-radius: 50%; object-fit: cover; margin: 0;" />
						</div>
					</header>

				<!-- Nav -->
					<nav id="nav">
						<ul class="links">
							<li><a href="index.html"><span class="two-line"><span>About</span><span>&amp; Events</span></span></a></li>
							<li><a href="recordings.html">Recordings</a></li>
							<li class="active"><a href="contact.html">Contact</a></li>
						</ul>
						<ul class="icons">
							<li><a href="https://www.youtube.com/@J-OCombo" class="icon brands fa-youtube"><span class="label">YouTube</span></a></li>
							<li><a href="https://www.facebook.com/profile.php?id=100080213184592" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>
						</ul>
					</nav>

				<!-- Main -->
					<div id="main">

						<!-- Post -->
							<section class="post">
								<header class="major">
									<h1 style="font-size: 2.75rem;">Contact Us</h1>
									<p>We look forward to hearing from you.</p>
								</header>

								<form id="contact-form">
									<div class="row gtr-uniform">
										<div class="col-6 col-12-xsmall">
											<input type="text" name="name" id="name" placeholder="Your Name" required />
										</div>
										<div class="col-6 col-12-xsmall">
											<input type="email" name="email" id="email" placeholder="Your Email" required />
										</div>
										<div class="col-12">
											<input type="text" name="subject" id="subject" placeholder="Subject" required />
										</div>
										<div class="col-12">
											<textarea name="message" id="message" placeholder="Your Message" rows="6" required></textarea>
										</div>
										<div class="col-12">
											<ul class="actions">
												<li><input type="submit" value="Send Message" class="primary" /></li>
												<li><input type="reset" value="Clear" /></li>
											</ul>
										</div>
									</div>
								</form>
							</section>

					</div>


				<!-- Copyright -->
					<div id="copyright">
						<ul><li>&copy; J&amp;O Combo</li><li>Design: <a href="https://html5up.net">HTML5 UP</a></li></ul>
					</div>

			</div>

		<!-- Scripts -->
			<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>

	</body>
</html>
